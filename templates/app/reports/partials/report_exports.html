{% with query_from=report_filters.from_date_value query_to=report_filters.to_date_value query_currency=report_filters.currency %}
  <div class="report-controls flex flex-wrap items-center gap-2">
    <a class="inline-flex min-h-9 items-center justify-center rounded-[5px] border border-[#e1e4df] bg-[#fffdfa] px-3 py-1.5 text-xs font-bold text-[#29404d] transition-all duration-200 hover:border-[#7d9b9a] dark:border-slate-600 dark:bg-slate-900 dark:text-slate-200" href="{% url 'app:export-report-csv' %}?report={{ export_report }}&from_date={{ query_from }}&to_date={{ query_to }}&currency={{ query_currency }}">تصدير CSV</a>
    <button class="inline-flex min-h-9 items-center justify-center rounded-[5px] border border-[#d49b55] bg-[#d49b55] px-3 py-1.5 text-xs font-bold text-[#fffdfa] transition-all duration-200 hover:bg-[#a06b25]" type="button" onclick="window.print()">طباعة التقرير</button>
  </div>
{% endwith %}
